<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME26 Lobi | Katılım Onayı</title>
    <!-- Tailwind CSS (Tasarım Motoru) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js (Otonom Belge Okuma Motoru) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // PDF Okuyucu Ayarı
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        // Tasarım Renk Ayarları
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kaos: '#ea580c', // Turuncu marka rengimiz
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
        
        <!-- Üst Başlık ve Logo Alanı -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter text-white mb-1">ME26 <span class="text-kaos">LOBİ</span></h1>
            <p class="text-gray-400 text-xs font-medium tracking-widest uppercase">Sistem Kuran İçmimarlık Ağı</p>
        </div>

        <form id="kayit-formu" class="space-y-6">
            
            <!-- 1. Google ile Giriş veya Telefon (Dünya Standardı) -->
            <div>
                <label class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Telefon Numarası</label>
                <input type="tel" id="telefon" placeholder="+90 5XX XXX XX XX" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:border-kaos transition text-sm font-medium" required>
                <p class="text-[10px] text-gray-500 mt-1">Lütfen ülke kodu ile birlikte giriniz.</p>
            </div>

            <!-- 2. e-Devlet PDF Yükleme Alanı -->
            <div class="p-4 border border-slate-700 bg-slate-800 rounded-lg text-center">
                <label class="block text-xs font-bold text-gray-300 mb-3 uppercase tracking-widest">Liyakat Kanıtı</label>
                <p class="text-xs text-gray-400 mb-4">e-Devlet'ten alınmış Öğrenci veya Mezuniyet belgenizi (PDF) yükleyin.</p>
                <input type="file" id="pdf-yukle" accept="application/pdf" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-kaos file:text-white hover:file:bg-orange-700 transition cursor-pointer" required>
                <p class="text-[10px] text-gray-500 mt-3">*Belgeniz sadece cihazınızda işlenir, güvenlik amacıyla sunucularımıza yüklenmez.</p>
            </div>

            <!-- Bilgi Mesajı Ekranı -->
            <div id="islem-durumu" class="hidden p-3 rounded-lg text-xs font-semibold text-center mt-2"></div>

            <!-- 3. Gönder Butonu -->
            <button type="submit" id="gonder-btn" class="w-full bg-white text-black font-black uppercase tracking-wider py-4 rounded-lg hover:bg-gray-200 transition active:scale-95 flex justify-center items-center">
                <span>Ağa Katılma Talebi Gönder</span>
            </button>

        </form>
    </div>

    <!-- SİSTEM ZEKASI (JAVASCRIPT) -->
    <script>
        document.getElementById('kayit-formu').addEventListener('submit', async function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini durdur
            
            const btn = document.getElementById('gonder-btn');
            const durumEkrani = document.getElementById('islem-durumu');
            const telefon = document.getElementById('telefon').value.trim();
            const fileInput = document.getElementById('pdf-yukle');
            const file = fileInput.files[0];

            if(!file) {
                gosterDurum("Lütfen e-Devlet PDF belgenizi yükleyin.", "error");
                return;
            }

            // Arayüzü Yükleniyor Moduna Al
            btn.disabled = true;
            btn.innerHTML = `Sistem Belgeyi Analiz Ediyor...`;
            gosterDurum("Belge cihazınızda güvenle taranıyor, lütfen bekleyin...", "info");

            try {
                // PDF.js ile belgeyi tarayıcıda okuma işlemi
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let tamMetin = "";

                for(let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const text = content.items.map(item => item.str).join(" ");
                    tamMetin += text + " ";
                }

                tamMetin = tamMetin.toUpperCase('tr-TR');

                // Veri Cımbızlama (Regex Motoru)
                const tcMatch = tamMetin.match(/T\.C\.\s*KİMLİK\s*NO\s*:\s*(\d{11})/);
                const barkodMatch = tamMetin.match(/BARKOD\s*NUMARASI\s*:\s*([A-Z0-9]+)/);
                const universiteMatch = tamMetin.match(/PROGRAM\s*:\s*(.*?)\//);
                // Burada İçmimarlık kelimesinin birleşik yazımına dikkat ediyoruz
                const bolumMatch = tamMetin.match(/PROGRAM\s*:\s*.*?\/(.*?MİMARLIK.*?)/); 
                const yilMatch = tamMetin.match(/MEZUNİYET\s*TARİHİ\s*:\s*.*?\.(20\d{2})/);

                // 1. Kalkan: İçmimarlık Kontrolü
                if (!bolumMatch || !bolumMatch[1].replace(/\s+/g, '').includes("İÇMİMARLIK")) {
                    throw new Error("SİSTEM REDDİ: Bu belge bir İçmimarlık belgesi değil.");
                }

                // 2. Kalkan: Barkod ve TC Kontrolü
                const tc_kimlik = tcMatch ? tcMatch[1] : null;
                const edevlet_barkod = barkodMatch ? barkodMatch[1] : null;
                const universite = universiteMatch ? universiteMatch[1].trim() : null;
                const mezuniyet_yili = yilMatch ? yilMatch[1] : null;

                if (!tc_kimlik || !edevlet_barkod) {
                    throw new Error("HATA: Belgeden Barkod veya TC okunamadı. Lütfen geçerli belge yükleyin.");
                }

                // VERİLER HAZIR! Supabase Kasasına Gönderme Aşaması
                const toplananVeri = {
                    telefon: telefon,
                    tc_kimlik: tc_kimlik,
                    edevlet_barkod: edevlet_barkod,
                    universite: universite,
                    mezuniyet_yili: mezuniyet_yili,
                    durum: 'BEKLİYOR' // Lider Onayı için
                };

                console.log("Kasaya Giden Temiz Veri:", toplananVeri);
                
                // NOT: Şefim, aşağıdaki supabase gönderme kodunu kendi Supabase URL ve Key'inle 
                // entegre ettiğin Javascript dosyana (veya Supabase JS kütüphanesiyle buraya) bağlayacaksın.
                
                /*
                const { data, error } = await supabase.from('uyeler').insert([toplananVeri]);
                if(error) throw error;
                */

                gosterDurum("Başarılı! Liyakat verileriniz alındı. Lider onayından sonra ağa giriş yapabileceksiniz.", "success");
                btn.innerHTML = `ONAY BEKLENİYOR`;
                
            } catch (hata) {
                console.error(hata);
                gosterDurum(hata.message, "error");
                btn.disabled = false;
                btn.innerHTML = `Tekrar Dene`;
            }
        });

        // Durum Mesajlarını Ekranda Gösterme Fonksiyonu
        function gosterDurum(mesaj, tip) {
            const kutu = document.getElementById('islem-durumu');
            kutu.classList.remove('hidden', 'bg-red-900', 'text-red-200', 'bg-green-900', 'text-green-200', 'bg-blue-900', 'text-blue-200');
            
            if(tip === "error") {
                kutu.classList.add('bg-red-900', 'text-red-200');
            } else if(tip === "success") {
                kutu.classList.add('bg-green-900', 'text-green-200');
            } else {
                kutu.classList.add('bg-blue-900', 'text-blue-200');
            }
            
            kutu.innerText = mesaj;
        }
    </script>
</body>
</html>
